function trailState(map,path){let energy=map.energy,score=0,stops=new Set(),seen=new Set([path[0]]),photos=0;for(const index of path.slice(1)){energy--;if(seen.has(index))continue;seen.add(index);const type=map.cells[index].type;if(type==='cafe'){energy+=3;score+=4;}else if(['hill','lake','village','forest'].includes(type)){score+=type===map.bonus?15:8;photos++;stops.add(type);}}score+=stops.size*8;return {energy,score,photos,variety:stops.size,seen,arrived:path.at(-1)===map.end};}
function legalStep(map,path,next){if(!Number.isInteger(next)||next<0||next>=36||map.cells[next].type==='rock')return false;const a=path.at(-1),x=a%6,y=Math.floor(a/6);return Math.abs(x-next%6)+Math.abs(y-Math.floor(next/6))===1&&trailState(map,path).energy>0;}
const PRODUCTS=[{id:'coffee',zh:'手冲咖啡',en:'Coffee',cost:3,price:7},{id:'print',zh:'旅行明信片',en:'Postcards',cost:2,price:6},{id:'craft',zh:'手作徽章',en:'Pins',cost:4,price:10}];
function marketDays(seed){const r=rng(seed);return Array.from({length:8},(_,i)=>{const weather=Math.floor(r()*3);const event=Math.floor(r()*3);const base=PRODUCTS.map((_,j)=>Math.max(2,Math.round(4+r()*5+(event===j?3:0)+(weather===0&&j===0?2:0)-(weather===2&&j!==0?2:0))));return {day:i+1,weather,event,base};});}
function demandFor(day,p,priceLevel){return Math.max(0,Math.floor(day.base[p]*(priceLevel===0?1.45:priceLevel===2?.65:1)));}
function salePrice(p,level){return PRODUCTS[p].price+(level===0?-1:level===2?3:0);}
function marketCost(stock){return stock.reduce((v,n,i)=>v+n*PRODUCTS[i].cost,0);}
function runMarketDay(day,cash,stock,levels){if(!Array.isArray(stock)||stock.length!==3||stock.some(n=>!Number.isInteger(n)||n<0||n>12)||stock.reduce((a,b)=>a+b,0)>18||marketCost(stock)>cash||levels.length!==3||levels.some(l=>!Number.isInteger(l)||l<0||l>2))throw Error('Invalid market allocation');let sold=stock.map((n,i)=>Math.min(n,demandFor(day,i,levels[i])));let revenue=sold.reduce((v,n,i)=>v+n*salePrice(i,levels[i]),0);const cost=marketCost(stock);return {cash:cash-cost+revenue,cost,revenue,profit:revenue-cost,sold,waste:stock.map((n,i)=>n-sold[i])};}
function makeBeats(bpm=100){const interval=60/bpm;const beats=[];for(let i=0;i<32;i++){if(i%8===7)continue;beats.push({time:4*interval+i*interval+(i%8===5?interval*.5:0),kind:i%4===0?'accent':'beat'});}return beats;}
function judgeBeat(delta){const d=Math.abs(delta);return d<=.085?{label:'perfect',points:100}:d<=.17?{label:'good',points:65}:null;}
function rhythmGrade(points,total){const p=total?points/(total*100):0;return p>=.9?'S':p>=.75?'A':p>=.55?'B':'C';}

// The game's side of a web portal: loading, gameplay start and stop, and ad breaks. A portal build
// passes an adapter with the same method names (one for Poki, later one for CrazyGames); without one,
// as on our own sites, every call is a no-op. Either way the events go out in an order the portals
// accept: loading finishes once, start and stop alternate and never repeat, and nothing is sent
// while an ad is running. A failing adapter never stops the game.
function tailPlatform(adapter=null){
 let loaded=false,playing=false,inBreak=false;const sent=[];
 const send=(name,...args)=>{sent.push(name);try{return adapter?.[name]?.(...args);}catch{return undefined;}};
 return{
  sent,
  get playing(){return playing;},
  get inBreak(){return inBreak;},
  loadingFinished(){if(loaded)return;loaded=true;send('loadingFinished');},
  gameplayStart(){if(!loaded||playing||inBreak)return;playing=true;send('gameplayStart');},
  gameplayStop(){if(!playing||inBreak)return;playing=false;send('gameplayStop');},
  // A natural break between days. The portal decides whether an ad actually plays.
  async commercialBreak(){if(inBreak||!adapter?.commercialBreak)return;this.gameplayStop();inBreak=true;try{await send('commercialBreak');}catch{}finally{inBreak=false;}},
  // An ad the player asked for; resolves true only when the portal says it was watched in full.
  async rewardedBreak(){if(inBreak||!adapter?.rewardedBreak)return false;this.gameplayStop();inBreak=true;try{return (await send('rewardedBreak'))===true;}catch{return false;}finally{inBreak=false;}},
  canReward(){return !!adapter?.rewardedBreak&&!inBreak;}};
}
